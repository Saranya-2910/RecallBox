name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: recallbox
          POSTGRES_PASSWORD: recallbox_secret
          POSTGRES_DB: recallbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://recallbox:recallbox_secret@localhost:5432/recallbox_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://recallbox:recallbox_secret@localhost:5432/recallbox_test
          DATABASE_URL: postgresql+asyncpg://recallbox:recallbox_secret@localhost:5432/recallbox_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
        run: |
          cd backend
          pytest -v
